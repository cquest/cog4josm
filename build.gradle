plugins {
    id 'java-library'
}

group = 'org.openstreetmap.josm.plugins'
version = '0.3.0'

repositories {
    mavenCentral()
}

dependencies {
    // API JOSM (contient aussi JMapViewer, JCS…). Récupérable via ./fetch-josm.sh
    compileOnly files('lib/josm-tested.jar')

    // AUCUNE dependance de runtime : le jar plugin ne contient que les classes
    // du plugin (licence GPL v2+ seule, rien d'embarque). Les modeles de
    // projection hors du perimetre crs/ sont refuses explicitement (le repli
    // proj4j de la phase 2.2 a ete retire en 2.4 pour rester sous GPL pure).
    // NEVER add proj4j/proj4j-epsg : la base EPSG embarquee a des termes
    // restrictifs (voir Apache CALCITE-5399) et casse la licence du projet.

    // Phase 2.3: the EPSG code fallback reads the projection definitions
    // shipped by JOSM itself (data/projection/custom-epsg). Compile and
    // runtime resolution go through JOSM's classloader chain; the test task
    // needs the same jar on its classpath to exercise that resource.
    // NEVER move this to implementation: nothing from JOSM may be embedded.
    testImplementation files('lib/josm-tested.jar')

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

test {
    useJUnitPlatform()
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat 'full'
    }
}

jar {
    archiveFileName = 'cog4josm.jar'
    // Single self-contained plugin jar: ONLY the plugin classes (no runtime
    // dependency to embed, see the dependencies block; JOSM itself provides
    // the rest at runtime).
    manifest {
        def buildDate = new java.text.SimpleDateFormat("yyyy-MM-dd").format(new java.util.Date())
        attributes(
            // IMPORTANT : noms d'attributs officiels JOSM (Plugin-Class, Plugin-Mainversion,
            // Plugin-Minimum-Java-Version). Les variantes hyphenees sont ignorees par JOSM.
            'Plugin-Class': 'org.openstreetmap.josm.plugins.cog.CogPlugin',
            'Plugin-Mainversion': '19678',
            'Plugin-Minimum-Java-Version': '17',
            'Plugin-Stage': '50',
            'Plugin-Version': project.version,
            'Plugin-Description': 'Affiche des images COG (Cloud Optimized GeoTIFF) distantes comme couches d\'arriere-plan, lues par HTTP byte-ranges',
            'Plugin-Date': buildDate,
            'Implementation-Title': 'cog4josm',
            'Implementation-Version': project.version
        )
    }
}

// CLI de diagnostic (phase 0 du plan) : ./gradlew spike --args="https://exemple.com/image.tif"
tasks.register('spike', JavaExec) {
    group = 'application'
    description = 'Lit les en-tetes d un COG distant via byte-ranges et affiche la pyramide'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.openstreetmap.josm.plugins.cog.reader.CogDumpCli'
}

// Sert le COG d exemple (EPSG:3857) avec byte-ranges : ./gradlew serve-cog --args="sample 8765"
tasks.register('serve-cog', JavaExec) {
    group = 'application'
    description = 'Serviteur HTTP statique avec byte-ranges pour tests locaux de COG'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.openstreetmap.josm.plugins.cog.tools.CogFileServer'
}
